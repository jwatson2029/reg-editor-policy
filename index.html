<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REG Editor Policy</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>.reg Editor</h1>
      <p>Create and export a Windows Registry (.reg) file.</p>

      <form id="reg-form" class="form">
        <label for="filename">File name</label>
        <input id="filename" type="text" value="policy.reg" required />

        <section class="policy-section" aria-labelledby="policy-title">
          <h2 id="policy-title">Microsoft Edge policies</h2>
          <p>Select the policies you want to include in the exported registry file.</p>
          <div id="policy-list" class="policy-list" role="group" aria-labelledby="policy-title"></div>
        </section>

        <button type="submit">Export .reg file</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
