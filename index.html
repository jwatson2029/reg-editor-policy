<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REG Editor Policy</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>.reg Editor</h1>
      <p>Create and export a Windows Registry (.reg) file.</p>

      <form id="reg-form" class="form">
        <label for="filename">File name</label>
        <input id="filename" type="text" value="policy.reg" required />

        <label for="reg-content">Registry content</label>
        <textarea
          id="reg-content"
          rows="14"
          required
        >Windows Registry Editor Version 5.00

[HKEY_CURRENT_USER\Software\Policies\Example]
"Enabled"=dword:00000001</textarea>

        <button type="submit">Export .reg file</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
